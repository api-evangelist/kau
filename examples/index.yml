specification: API Evangelist Examples
specificationVersion: '0.1'
provider: King Abdulaziz University
providerId: kau
generated: '2026-09-01'
method: probed
source: >-
  Live HTTP fetches performed 2026-09-01, except kau-open-data-students-example.json,
  which is an Internet Archive capture and says so in its own entry. Nothing in this
  directory is synthesized — each file is an unmodified response body, or a verbatim
  slice of one, returned by the URL recorded against it.
description: >-
  Verbatim responses captured from King Abdulaziz University surfaces. Operator is
  recorded per example, because KAU runs some of these and rents others. The two LMS
  examples are Blackboard's engineering answering on KAU's hostname; the OAI-PMH
  Identify is Elsevier's Digital Commons answering for KAU's journals; only the open
  data payload is KAU's own service.
examples:
  - file: kau-open-data-students-example.json
    url: https://opendata.kau.edu.sa/api/StudentsData?type=u&year=2023&semester=1
    status: 200
    content_type: application/json
    x-operator: institution
    method: derived
    captured_via: >-
      Internet Archive, not a live fetch. Retrieved 2026-09-01 from
      https://web.archive.org/web/20250417190254id_/https://opendata.kau.edu.sa/api/StudentsData?type=u&year=2023&semester=1
      (capture date 2025-04-17). opendata.kau.edu.sa resolves in DNS but refused
      connections from two independent network egresses during this run, along with
      every other host in KAU's 192.162.72.0/24 block.
    truncated: >-
      The archived response carried 1,886 records. This file holds the first 12,
      byte-identical and unedited, to keep the repository proportionate. The record
      count, property set and JSON types quoted in the OpenAPI and JSON Schema were
      computed across the full 1,886, not across this slice.
    describes: >-
      Aggregate postgraduate enrollment counts for term 202310, broken down by faculty,
      department, level, study type, gender, nationality and admission cohort. Field
      values are Arabic. No record identifies an individual.
  - file: kau-lms-system-version-example.json
    url: https://lms.kau.edu.sa/learn/api/public/v1/system/version
    status: 200
    content_type: application/json;charset=UTF-8
    x-operator: tenant
    method: probed
    describes: >-
      The one unauthenticated endpoint on KAU's Blackboard Learn REST API, returning the
      running product version — Learn 4000.21.0-rel.28+435d029. Kept as evidence that
      the LMS API is genuinely deployed and answering on KAU's hostname, and as the
      operator evidence itself: the response, and the x-blackboard-product header
      alongside it, name Blackboard's product, not KAU's.
  - file: kau-lms-unauthenticated-error-example.json
    url: https://lms.kau.edu.sa/learn/api/public/v1/courses
    status: 401
    content_type: application/json;charset=UTF-8
    x-operator: tenant
    method: probed
    describes: >-
      The authentication gate on the same API. A 401 with a JSON error body rather than
      a 404 is what establishes that the Learn REST API surface is present and
      provisioned on this tenancy, not merely routed. Recorded because a 401 is a
      finding, not a gap.
  - file: kau-journals-oai-identify-example.xml
    url: https://kauj.researchcommons.org/do/oai/?verb=Identify
    status: 200
    content_type: text/xml
    x-operator: tenant
    method: probed
    describes: >-
      OAI-PMH 2.0 Identify response for King Abdulaziz University Journals. This is the
      document that settles the operator question for KAU's journal platform: the
      repositoryName is "King Abdulaziz University Journals" but the adminEmail is
      dc-support@elsevier.com and the baseURL is on researchcommons.org. KAU's content
      and KAU's editorial programme, Elsevier's Digital Commons contract.
  - file: ../identity-federation/kau-lms-saml-authnrequest.xml
    url: https://lms.kau.edu.sa/auth-saml/saml/metadata?apId=_7123_1
    status: 200
    content_type: text/html;charset=UTF-8
    x-operator: institution
    method: probed
    describes: >-
      A live, signed SAML 2.0 AuthnRequest generated by KAU's Blackboard service
      provider, base64-decoded from the auto-submitting POST form the endpoint returns.
      Filed under identity-federation/ rather than here because of what it proves: its
      Destination names https://iam.kau.edu.sa/oamfed/idp/samlv20, KAU's own SAML
      identity provider. It is the only artifact in this repository that evidences an
      institution-operated surface we could not reach directly.
