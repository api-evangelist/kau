  detail: >-
    Re-profiled 2026-09-01 against the university pipeline's operator axis, replacing a
    2026-06-03 profile that recorded a single gated SSO entry and described KAU's Open
    Data page as an empty beta placeholder. Both findings were wrong. KAU operates two
    real institution-run surfaces: an unauthenticated Open Data API at
    opendata.kau.edu.sa with eight endpoints KAU itself publishes, and a self-hosted
    SAML 2.0 identity provider at iam.kau.edu.sa/oamfed/idp/samlv20. Three tenant
    relationships (Elsevier Digital Commons journals, Blackboard Learn, Al Manhal) and
    two registry memberships (Crossref, ROR) are recorded without saving any vendor
    contract.

    One honest limitation. Every host in KAU's self-hosted 192.162.72.0/24 block —
    opendata, sso, iam, research, journals, marz — refused connections on 443 from two
    independent network egresses, while KAU's CloudFront-fronted www host and all three
    vendor tenancies answered normally throughout. This is a geographic restriction on
    KAU's own estate, not a block on us and not a dead service: the SAML IdP was proven
    live during the run by a signed AuthnRequest from KAU's own Blackboard tenancy, and
    the Open Data API's last verified 200 is an Internet Archive capture of 2025-04-17
    returning 1,886 records, corroborated by seven further 200 captures across 2024. The
    OpenAPI, JSON Schema and vocabulary in this repository are consequently marked
    derived rather than probed-live. State is recorded as covered because the surfaces
    were found, attributed and evidenced — not because everything answered.

    Evidenced negatives worth keeping: no DataCite account, no ORCID member organisation,
    no Shibboleth, no membership of the Maeen national identity federation or eduGAIN
    despite thirty-eight Saudi peers being registered, no official GitHub organisation,
    no developer portal, no API key or client registration anywhere, and no
    KAU-published OpenAPI. The dataset download links on KAU's own Open Data page are
    also broken: every GetFile.aspx URL returns 404 after the site's migration to
    Next.js, so the spreadsheet half of the programme is dead while the API half is not.
  evidence:
