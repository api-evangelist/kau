apis:
  - aid: kau:open-data
    name: KAU Open Data API
    x-operator: institution
    x-operator-basis: >-
      opendata.kau.edu.sa is under kau.edu.sa, KAU's own registrable domain, resolving to
      192.162.72.12 inside the university's own self-hosted address block. The endpoints
      are published by KAU on its own Open Data page under a KAU open-data licence. No
      vendor host, vendor contact or vendor product name appears anywhere in this surface.
    description: >-
      King Abdulaziz University's own open data web service. A single GET endpoint,
      /api/StudentsData, returns aggregate student enrollment and graduation counts
      broken down by faculty, department, educational level, study type, gender,
      nationality and admission cohort. KAU publishes eight parameter combinations on its
      Open Data page and requires no credential for any of them. Records are aggregate
      counts only and no record identifies an individual. The 2026-06-03 profile of this
      institution recorded KAU's Open Data page as an empty beta placeholder with no
      datasets or endpoints; that was wrong and this entry is the correction.

      The host could not be reached from this run — it resolves in DNS but refused
      connections on 443 from two independent network egresses, as did every other host
      in KAU's self-hosted block, while its CloudFront-fronted www host answered 200
      throughout. That pattern reads as a geographic access restriction rather than a
      dead service. The last verified HTTP 200 is an Internet Archive capture of
      2025-04-17 returning 1,886 records, with seven further parameter combinations
      independently captured at 200 across 2024. The OpenAPI is marked derived, not
      probed-live, for exactly this reason.
