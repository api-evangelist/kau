aid: kau
name: King Abdulaziz University
x-type: university
x-category: Public Research University
description: >-
  King Abdulaziz University (KAU) is a large public research university in Jeddah, Saudi
  Arabia, serving over 100,000 students across 30 faculties and institutes including a
  branch campus at Rabigh. Its programmable footprint is small but, unusually for this
  cohort, partly its own. KAU operates a genuine institution-run Open Data API at
  opendata.kau.edu.sa returning aggregate student enrollment and graduation statistics as
  JSON over eight documented, unauthenticated GET invocations, and it operates its own
  SAML 2.0 identity provider at iam.kau.edu.sa/oamfed/idp/samlv20 on Oracle Access
  Manager Federation, self-hosted in KAU's own 192.162.72.0/24 address block with no
  managed-IdP vendor underneath it.

  Everything else that looks like a KAU API belongs to somebody else. The best
  machine-readable surface associated with the university — a complete OAI-PMH 2.0 data
  provider carrying its journals back to 2000 — is Elsevier's Digital Commons at
  kauj.researchcommons.org, administered from dc-support@elsevier.com. Its learning
  platform is a Blackboard Learn SaaS tenancy on lms.kau.edu.sa, and its scientific
  platform at libsp.kau.edu.sa is an Al Manhal tenancy. All three are recorded here as
  tenant relationships and none of their contracts is claimed as KAU's.

  KAU is a Crossref member in its own right under DOI prefix 10.4197 and is registered in
  ROR. It holds no DataCite account, publishes no SAML metadata, and belongs to neither
  the Maeen national identity federation nor eduGAIN although thirty-eight Saudi entities
  do. There is no developer portal, no API key or client registration of any kind, no
  official GitHub organisation, and no OpenAPI — the specification in this repository is
  derived by API Evangelist from KAU's published endpoints and a real response body, not
  published by KAU.
