  - aid: kau:identity-federation
    name: KAU SAML 2.0 Identity Provider
    x-operator: institution
    x-operator-basis: >-
      iam.kau.edu.sa is under kau.edu.sa and resolves to 192.162.72.96 in KAU's own
      self-hosted block, with no CNAME to any managed identity platform — the pattern
      that correctly demotes other institutions' IdPs to tenant. The Oracle Access
      Manager software is a vendor's; the deployment is KAU's.
    description: >-
      King Abdulaziz University's institutional SAML 2.0 identity provider, running
      Oracle Access Manager Federation at /oamfed/idp/samlv20. The IdP itself is
      unreachable from outside Saudi Arabia, so it was evidenced indirectly and
      conclusively: KAU's Blackboard service provider generated a freshly signed,
      freshly timestamped SAML AuthnRequest addressed to it during this run
      (IssueInstant 2026-09-01T17:11:59.020Z, RSA-SHA256), which is archived in this
      repository. The 2026-06-03 profile recorded the federation endpoint as
      /oamsso-bin/login-fed.pl; the actual SAML 2.0 protocol endpoint is
      /oamfed/idp/samlv20, corrected here from live evidence.

      Not a developer API and not federated outward. KAU publishes no SAML metadata and
      belongs to neither Maeen, Saudi Arabia's national identity federation, nor
      eduGAIN, although thirty-eight Saudi entities including King Saud University,
      KFUPM, KAUST and King Khalid University are registered in Maeen. KAU runs
      federation for itself only, so no external relying party can federate with it even
      in principle.
    humanURL: https://www.kau.edu.sa/page/open-data
