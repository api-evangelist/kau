  - date: '2026-09-01'
    rating: 4
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES
      each surface before saving anything. The 2026-06-03 review is corrected on its two
      central findings. It recorded KAU's Open Data page as "a beta placeholder with no
      datasets, endpoints, or downloads"; the page in fact publishes eight live
      https://opendata.kau.edu.sa/api/StudentsData API invocations and a decade of dataset
      downloads. And it recorded KAU's identity infrastructure as merely "gated"; KAU
      operates its own SAML 2.0 identity provider, evidenced during this run by a freshly
      signed AuthnRequest its Blackboard tenancy addressed to
      https://iam.kau.edu.sa/oamfed/idp/samlv20 (the earlier review named
      /oamsso-bin/login-fed.pl, which is the OAM login entry point, not the SAML protocol
      endpoint).

      KAU therefore has two genuinely institution-operated surfaces, which is more than
      most of this cohort. It also has three tenant relationships that are recorded but
      whose contracts are deliberately NOT claimed as KAU's: its journals run on Elsevier's
      Digital Commons at kauj.researchcommons.org, complete with a working OAI-PMH 2.0 data
      provider back to 2000 administered from dc-support@elsevier.com; its LMS is a
      Blackboard Learn SaaS tenancy at lms.kau.edu.sa; and its scientific platform at
      libsp.kau.edu.sa is an Al Manhal tenancy. The OAI-PMH endpoint is the best
      machine-readable surface associated with this university and it is Elsevier's
      engineering, not KAU's.

      Registry memberships verified: Crossref member 2709 (prefix 10.4197, 1,920 DOIs) and
      53473, plus ROR https://ror.org/02ma4wv74 and Crossref Funder ID 501100004054.
      Evidenced negatives: no DataCite account despite 1,249 DOIs affiliated to KAU's ROR,
      no ORCID member organisation, no Shibboleth, no membership of Saudi Arabia's Maeen
      identity federation or eduGAIN although 38 Saudi entities are registered, no GitHub
      organisation, no developer portal, and no API key or client registration anywhere.

      One limitation stated plainly: every host in KAU's self-hosted 192.162.72.0/24 block
      refused connections on 443 from two independent network egresses, while KAU's
      CloudFront-fronted www host and all three vendor tenancies answered normally. That is
      a geographic restriction on KAU's own estate rather than a dead service or a block on
      us — the IdP was proven live indirectly, and the Open Data API's last verified 200 is
      an Internet Archive capture of 2025-04-17 returning 1,886 records, corroborated by
      seven further 200 captures across 2024. Artifacts derived from it are marked derived,
      not probed-live.
